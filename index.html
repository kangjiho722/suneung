<html lang="ko">
<head>

<title>순서·삽입 훈련 | 수능 영어</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--line:#dde3ef;--main:#2f4ea2;--ok:#1f9d55;--no:#d64545;--txt:#1d2433;--sub:#6b7488;--fs:17px}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
header{background:var(--main);color:#fff;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:19px}
header small{opacity:.85}
.hbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:700;margin-left:4px}
.hbtn:hover{background:rgba(255,255,255,.3)}
.layout{display:flex;gap:18px;max-width:1180px;margin:18px auto;padding:0 14px;align-items:flex-start}
aside{width:260px;flex-shrink:0;position:sticky;top:12px}
main{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.ch{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;margin-bottom:7px;cursor:pointer;font-size:14px}
.ch b{display:block}
.ch span{color:var(--sub);font-size:12px}
.ch.on{border-color:var(--main);background:#eaf0ff}
.ch.off{opacity:.45;cursor:not-allowed}
.stat{font-size:13px;color:var(--sub);margin:2px 0 6px}
.bar{height:7px;background:#e6ebf5;border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.ctl{font-size:13px;margin:8px 0}
.ctl select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.badges span{display:inline-block;font-size:12px;border-radius:20px;padding:2px 10px;margin-right:6px;font-weight:600}
.b1{background:#e7ecff;color:var(--main)}.b2{background:#fff0d9;color:#b36b00}.b3{background:#e4f6ec;color:var(--ok)}
.q-title{font-size:16px;font-weight:700;margin:10px 0 12px}
.box{border:1.5px solid #333;padding:14px 16px;margin-bottom:14px;background:#fff;font-family:"Times New Roman",serif;font-size:var(--fs);line-height:1.85}
.para{font-family:"Times New Roman",serif;font-size:var(--fs);line-height:1.85;margin:0 0 12px}
.para .lab{font-weight:700;font-family:system-ui,sans-serif}
.passage{font-family:"Times New Roman",serif;font-size:var(--fs);line-height:2}
.clue{background:#ffe1e1;border-bottom:2px solid #ef6a6a;border-radius:3px;padding:0 2px;font-weight:600}
.noclue .clue{background:none;border:none;font-weight:inherit;padding:0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:15px;cursor:pointer}
.opt:hover:not(:disabled){background:#f0f4ff}
.opt.sel{border-color:var(--main);background:#eaf0ff}
.opt.right{border-color:var(--ok);background:#e4f6ec;font-weight:700}
.opt.wrong{border-color:var(--no);background:#fde8e8}
.slot{border:1px dashed #8a97b8;background:#f6f8ff;border-radius:6px;padding:0 6px;margin:0 3px;cursor:pointer;font-size:15px;font-family:system-ui}
.slot.sel{background:var(--main);color:#fff;border-style:solid}
.slot.right{background:var(--ok);color:#fff;border-style:solid}
.slot.wrong{background:var(--no);color:#fff;border-style:solid}
.btn{background:var(--main);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-size:15px;cursor:pointer;margin:0 6px 6px 0}
.btn.gray{background:#8c95aa}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:13px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.dot{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.dot.cur{outline:2px solid var(--main)}.dot.ok{background:var(--ok);color:#fff}.dot.no{background:var(--no);color:#fff}
.verdict{font-size:18px;font-weight:800}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
ul.cl{padding-left:20px;margin:8px 0}
ul.cl li{margin-bottom:4px;font-size:14.5px}
.tip{background:#fffbe6;border:1px solid #f0e2a0;border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0}
mark.ins{background:#fff3a3;padding:1px 3px;border-radius:3px}
.tag{display:inline-block;background:var(--main);color:#fff;border-radius:4px;font-size:12px;padding:0 6px;margin-right:4px;font-family:system-ui}
.blk{margin-bottom:8px}
.unit{cursor:pointer;border-radius:4px;padding:1px 2px}
.unit.hid{background:#eef1f8;color:#5a6785}
.unit.hid:hover{background:#dfe6f7}
.unit.xs{border-bottom:2px solid #f2c200}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;margin-bottom:10px}
#timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--main)}
details summary{cursor:pointer;font-weight:700;margin:8px 0}
.small{font-size:13px;color:var(--sub)}
kbd{background:#eef1f8;border:1px solid #cfd6e6;border-radius:4px;padding:0 5px;font-size:12px}
#errBox{max-width:1180px;margin:10px auto 0;padding:0 14px}
#errBox pre{background:#fde8e8;color:#900;padding:10px;border-radius:8px;white-space:pre-wrap;margin:0 0 6px;font-size:13px}
@media(max-width:820px){.layout{flex-direction:column}aside{width:100%;position:static}}
</style>
</head>

   3. 유틸 / 저장소

var CIRC=['','①','②','③','④','⑤'];
var PERMS=[['A','C','B'],['B','A','C'],['B','C','A'],['C','A','B'],['C','B','A']];
var ORDER_CHOICES=PERMS.map(function(p){return '('+p[0]+') – ('+p[1]+') – ('+p[2]+')';});

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmt(s){return s.replace(/\[\[(.+?)\]\]/g,'<span class="clue">$1</span>');}
function strip(s){return s.replace(/\[\[|\]\]/g,'');}
/* 문장 분리: 마침표 뒤 공백 + 다음이 대문자/따옴표/[ ( 일 때만 */
function splitSent(s){return s.replace(/([.?!]["'\u201D]?)\s+(?=[A-Z"\u201C'\[(])/g,'$1|').split('|');}
function fmtT(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function $(id){return document.getElementById(id);}

var mem={};
function lsGet(k){try{var v=window.localStorage.getItem(k);return v===null?(mem[k]||null):v;}catch(e){return mem[k]||null;}}
function lsSet(k,v){mem[k]=v;try{window.localStorage.setItem(k,v);}catch(e){}}
function lsLoad(k,def){try{var v=lsGet(k);return v?JSON.parse(v):def;}catch(e){return def;}}

var KEY='sunseo_prog_v2', SKEY='sunseo_set_v2';
var prog={};
(function(){
  var raw=lsLoad(KEY,{});
  if(raw&&typeof raw==='object') Object.keys(raw).forEach(function(k){
    var v=raw[k];
    if(v&&typeof v.sel==='number'&&v.sel>=1&&v.sel<=5) prog[k]={sel:v.sel,sec:(typeof v.sec==='number'?v.sec:null)};
  });
})();
function save(){lsSet(KEY,JSON.stringify(prog));}

var ui={ch:1,i:0,sel:null,clue:false,wrong:false,wrongIds:[],type:'all',shuffle:false,rank:{},fs:17,qid:null,t0:0,solved:false};
(function(){
  var s=lsLoad(SKEY,{});
  if(s&&typeof s==='object'){
    if(typeof s.ch==='number'&&s.ch>=1&&s.ch<=CHAPTER_PLAN.length) ui.ch=s.ch;
    if(typeof s.fs==='number'&&s.fs>=13&&s.fs<=26) ui.fs=s.fs;
    if(s.type==='order'||s.type==='insert') ui.type=s.type;
  }
})();

/* 정오는 저장값이 아니라 현재 정답으로 매번 계산 */
function isOk(p){var st=prog[p.id];return !!st&&st.sel===p.answer;}
function reshuffle(){PASSAGES.forEach(function(p){ui.rank[p.id]=Math.random();});}

function getList(){
  var L=ui.wrong
    ? PASSAGES.filter(function(p){return ui.wrongIds.indexOf(p.id)>-1;})
    : PASSAGES.filter(function(p){return p.ch===ui.ch;});
  if(ui.type!=='all') L=L.filter(function(p){return p.type===ui.type;});
  if(ui.shuffle) L=L.slice().sort(function(a,b){return (ui.rank[a.id]||0)-(ui.rank[b.id]||0);});
  return L;
}

   4. 데이터 검증 (시작 시 1회)
============================================================ */
function validate(){
  var errs=[], seen={};
  PASSAGES.forEach(function(p){
    var w='['+p.id+'] ';
    if(seen[p.id]) errs.push(w+'id 중복'); seen[p.id]=1;
    if(!p.ch) errs.push(w+'챕터에 배정되지 않은 번호(no='+p.no+')');
    if(p.type!=='order'&&p.type!=='insert'){errs.push(w+'type 오류');return;}
    if(!(p.answer>=1&&p.answer<=5)) errs.push(w+'answer는 1~5');
    if(!p.clues||!p.clues.length) errs.push(w+'clues 없음');
    var all='';
    if(p.type==='order'){
      if(!p.given) errs.push(w+'given 없음');
      if(!p.parts||p.parts.length!==3) errs.push(w+'parts는 3개여야 함');
      all=(p.given||'')+(p.parts||[]).join('');
    }else{
      if(!p.sentence) errs.push(w+'sentence 없음');
      var m=(p.text||'').match(/\{[1-5]\}/g)||[];
      if(m.length!==5) errs.push(w+'text에 {1}~{5}가 정확히 한 번씩 있어야 함');
      all=(p.sentence||'')+(p.text||'');
    }
    var o=(all.match(/\[\[/g)||[]).length, c=(all.match(/\]\]/g)||[]).length;
    if(o!==c) errs.push(w+'[[ ]] 괄호 짝이 맞지 않음');
  });
  return errs;
}

function renderSide(){
  var html='';
  CHAPTER_PLAN.forEach(function(c){
    var items=PASSAGES.filter(function(p){return p.ch===c.id;});
    var done=items.filter(function(p){return prog[p.id];}).length;
    var right=items.filter(isOk).length;
    var off=!items.length;
    html+='<button class="ch '+((c.id===ui.ch&&!ui.wrong)?'on':'')+' '+(off?'off':'')+'" data-act="chap" data-v="'+c.id+'" '+(off?'disabled':'')+'>'
      +'<b>Chapter '+c.id+'</b><span>'+c.nums.join('·')+'번 · '+(off?'준비 중':done+'/'+items.length+' 풀이 · 정답 '+right)+'</span></button>';
  });
  $('chList').innerHTML=html;
  var solved=PASSAGES.filter(function(p){return prog[p.id];});
  var ok=solved.filter(isOk).length;
  var acc=solved.length?Math.round(ok/solved.length*100):0;
  $('sideStat').textContent='풀이 '+solved.length+'/'+PASSAGES.length+' · 정답 '+ok+' · 오답 '+(solved.length-ok)+' · 정답률 '+acc+'%';
  $('barFill').style.width=(PASSAGES.length?Math.round(solved.length/PASSAGES.length*100):0)+'%';
  $('wrongCnt').textContent=String(solved.length-ok);
  $('total').textContent='등록 지문 '+PASSAGES.length+' / '+TOTAL_TARGET;
}

function blocksOf(q){
  var B=[];
  function mk(label,s){return {label:label,units:splitSent(s).map(function(t){return {t:t,x:false};})};}
  if(q.type==='order'){
    var perm=PERMS[q.answer-1];
    B.push(mk('주어진 글',q.given));
    q.parts.forEach(function(p,i){B.push(mk('('+perm[i]+')',p));});
  }else{
    var raw=q.text.split(/\{\d\}/).map(function(s){return s.trim();});
    var cur={label:'본문',units:[]};
    raw.forEach(function(s,k){
      if(s) splitSent(s).forEach(function(t){cur.units.push({t:t,x:false});});
      if(k===q.answer-1) splitSent(q.sentence).forEach(function(t){cur.units.push({t:t,x:true});});
    });
    B.push(cur);
  }
  return B;
}
function hintOf(t){
  var w=strip(t).split(/\s+/);
  return w.slice(0,Math.max(0,Math.min(3,w.length-1))).join(' ')+' …';
}

function orderBody(q,st){
  var perm=PERMS[q.answer-1], by={};
  perm.forEach(function(l,i){by[l]=q.parts[i];});
  var h='<div class="box">'+fmt(q.given)+'</div>';
  ['A','B','C'].forEach(function(l){h+='<p class="para"><span class="lab">('+l+')</span> '+fmt(by[l])+'</p>';});
  var cur=st?st.sel:ui.sel;
  h+='<div style="margin-top:12px">';
  for(var n=1;n<=5;n++){
    var c='';
    if(st){ if(n===q.answer)c='right'; else if(n===st.sel)c='wrong'; }
    else if(n===cur)c='sel';
    h+='<button class="opt '+c+'" data-act="choice" data-v="'+n+'" '+(st?'disabled':'')+'>'+CIRC[n]+' '+ORDER_CHOICES[n-1]+'</button>';
  }
  return h+'</div>';
}

function insertBody(q,st){
  var cur=st?st.sel:ui.sel;
  var h='<div class="box">'+fmt(q.sentence)+'</div>';
  var body=fmt(q.text).replace(/\{(\d)\}/g,function(m,n){
    n=+n; var c='';
    if(st){ if(n===q.answer)c='right'; else if(n===st.sel)c='wrong'; }
    else if(n===cur)c='sel';
    return '<button class="slot '+c+'" data-act="slot" data-v="'+n+'" '+(st?'disabled':'')+'>( '+CIRC[n]+' )</button>';
  });
  return h+'<div class="passage">'+body+'</div>';
}

function resultBody(q,st){
  var ok=isOk(q);
  var ans=q.type==='order'?CIRC[q.answer]+' '+ORDER_CHOICES[q.answer-1]:CIRC[q.answer];
  var h='<div class="card"><div class="verdict '+(ok?'ok':'no')+'">'+(ok?'⭕ 정답!':'❌ 오답')
    +' <span style="font-size:15px;color:var(--txt)">정답: '+ans+'</span>'
    +(st.sec!=null?' <span class="small">· 풀이 시간 '+fmtT(st.sec)+'</span>':'')+'</div>'
    +'<div class="tip">🎯 <b>주제</b> : '+esc(q.topic)+'<br>🧭 <b>흐름</b> : '+esc(q.summary)+'</div>'
    +'<b>단서 체크 (연결어·지시어·대명사)</b><ul class="cl">'
    +q.clues.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>';

  h+='<details open><summary>✅ 정답 순서로 다시 읽기</summary><div class="passage">';
  if(q.type==='order'){
    var perm=PERMS[q.answer-1];
    h+='<p class="para">'+fmt(q.given)+'</p>';
    q.parts.forEach(function(p,i){h+='<p class="para"><span class="tag">'+perm[i]+'</span>'+fmt(p)+'</p>';});
  }else{
    var raw=q.text.split(/\{\d\}/).map(function(s){return s.trim();});
    raw.forEach(function(s,k){
      if(s) h+=fmt(s)+' ';
      if(k===q.answer-1) h+='<mark class="ins">'+fmt(q.sentence)+'</mark> ';
    });
  }
  h+='</div></details>';

  var blocks=blocksOf(q).map(function(b){
    var u=b.units.map(function(x){
      var hint=hintOf(x.t);
      return '<span class="unit hid '+(x.x?'xs':'')+'" data-act="unit" data-full="'+encodeURIComponent(fmt(x.t))+'" data-hint="'+esc(hint)+'">'+esc(hint)+'</span> ';
    }).join('');
    return '<div class="blk"><span class="tag">'+esc(b.label)+'</span> '+u+'</div>';
  }).join('');
  h+='<details><summary>🧠 암기 모드 (문장 첫 3단어만 보고 → 클릭해서 확인)</summary>'
    +'<div style="margin-bottom:8px"><button class="btn gray sm" data-act="hideall">모두 가리기</button>'
    +'<button class="btn gray sm" data-act="showall">모두 보기</button>'
    +(q.type==='insert'?'<span class="small"> 노란 밑줄 = 삽입 문장</span>':'')+'</div>'
    +'<div class="passage">'+blocks+'</div></details>';
  return h+'</div>';
}

function view(){
  var y=window.pageYOffset||0;
  document.documentElement.style.setProperty('--fs',ui.fs+'px');
  renderSide();
  var list=getList();
  var mainEl=$('main');
  if(!list.length){
    ui.solved=false;
    var msg=ui.wrong?'오답노트가 비어 있어요. 👍'
      :(ui.type!=='all'?'이 챕터에는 선택한 유형의 문제가 없습니다.':'해당 챕터는 준비 중입니다.');
    mainEl.innerHTML='<div class="card">'+msg+'</div>';
    return;
  }
  if(ui.i>=list.length) ui.i=list.length-1;
  if(ui.i<0) ui.i=0;
  var q=list[ui.i], st=prog[q.id];
  if(ui.qid!==q.id){ui.qid=q.id;ui.t0=Date.now();}
  ui.solved=!!st;
  if(st) ui.clue=true;

  var nav=list.map(function(p,k){
    var s=prog[p.id];
    return '<button class="dot '+(k===ui.i?'cur':'')+' '+(s?(isOk(p)?'ok':'no'):'')+'" data-act="jump" data-v="'+k+'" aria-label="'+(k+1)+'번 문제">'+(k+1)+'</button>';
  }).join('');
  var inst=q.type==='order'
    ? '주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.'
    : '글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.';

  mainEl.innerHTML=
   '<div class="nav">'+nav+'</div>'
   +'<div class="card '+(ui.clue?'':'noclue')+'" id="qbox">'
   +'<div class="badges"><span class="b1">Chapter '+q.ch+'</span><span class="b2">'+q.no+'번 유형 · '+(NUM_TYPE[q.no]||'')+'</span><span class="b3">'+(q.type==='order'?'순서':'삽입')+'</span></div>'
   +'<div class="q-title">'+q.no+'-'+(q.type==='order'?'순서':'삽입')+'. '+inst+'</div>'
   +'<div class="toolbar"><label><input type="checkbox" id="clueChk" '+(ui.clue?'checked':'')+'> 🔴 단서 표시</label>'
   +(st?'':'<span>⏱ <span id="timer">'+fmtT((Date.now()-ui.t0)/1000)+'</span></span>')
   +'<span class="small">※ 먼저 이해 → 단서 확인 → 순서 암기</span></div>'
   +(q.type==='order'?orderBody(q,st):insertBody(q,st))
   +'<div style="margin-top:14px">'
   +(st?'<button class="btn gray" data-act="retry">다시 풀기</button>':'<button class="btn" data-act="check" '+(ui.sel?'':'disabled')+'>정답 확인</button>')
   +'<button class="btn gray" data-act="prev" '+(ui.i===0?'disabled':'')+'>◀ 이전</button>'
   +'<button class="btn gray" data-act="next" '+(ui.i===list.length-1?'disabled':'')+'>다음 ▶</button>'
   +'</div></div>'
   +(st?resultBody(q,st):'');
  window.scrollTo(0,y);
}

function resetView(){ui.sel=null;ui.clue=false;ui.qid=null;}
function go(d){
  var list=getList(), n=ui.i+d;

}
function doCheck(q){
  if(!ui.sel||prog[q.id]) return;
  prog[q.id]={sel:ui.sel,sec:Math.round((Date.now()-ui.t0)/1000)};
  ui.sel=null;save();view();
}
function findAct(el){
  while(el&&el!==document){ if(el.getAttribute&&el.getAttribute('data-act')) return el; el=el.parentNode; }
  return null;
}

$('main').addEventListener('click',function(e){
  var t=findAct(e.target); if(!t) return;
  var a=t.getAttribute('data-act'), v=+t.getAttribute('data-v');
  var list=getList(), q=list[ui.i];
  if(!q) return;
  if(a==='choice'||a==='slot'){ if(!prog[q.id]){ui.sel=v;view();} }
  else if(a==='check'){doCheck(q);}
  else if(a==='retry'){delete prog[q.id];ui.sel=null;ui.clue=false;ui.t0=Date.now();save();view();}
  else if(a==='prev'){go(-1);}
  else if(a==='next'){go(1);}
  else if(a==='jump'){ui.i=v;resetView();view();}
  else if(a==='unit'){
    if(t.classList.contains('hid')){t.classList.remove('hid');t.innerHTML=decodeURIComponent(t.getAttribute('data-full'));}
    else{t.classList.add('hid');t.textContent=t.getAttribute('data-hint');}
  }
  else if(a==='hideall'||a==='showall'){
    var us=document.querySelectorAll('.unit');
    for(var k=0;k<us.length;k++){
      var u=us[k];
      if(a==='showall'){u.classList.remove('hid');u.innerHTML=decodeURIComponent(u.getAttribute('data-full'));}
      else{u.classList.add('hid');u.textContent=u.getAttribute('data-hint');}
    }
  }
});
$('main').addEventListener('change',function(e){
  if(e.target.id==='clueChk'){
    ui.clue=e.target.checked;
    var b=$('qbox'); if(b){ if(ui.clue) b.classList.remove('noclue'); else b.classList.add('noclue'); }
  }
});

$('chList').addEventListener('click',function(e){
  var t=findAct(e.target); if(!t||t.getAttribute('data-act')!=='chap') return;
  ui.ch=+t.getAttribute('data-v');ui.wrong=false;$('wrongOnly').checked=false;
  ui.i=0;resetView();saveSet();view();
});
$('wrongOnly').addEventListener('change',function(e){
  if(e.target.checked){
    ui.wrongIds=PASSAGES.filter(function(p){return prog[p.id]&&!isOk(p);}).map(function(p){return p.id;});
    ui.wrong=true;
  }else ui.wrong=false;
  ui.i=0;resetView();view();
});
$('typeSel').addEventListener('change',function(e){ui.type=e.target.value;ui.i=0;resetView();saveSet();view();});
$('shuffle').addEventListener('change',function(e){ui.shuffle=e.target.checked;if(ui.shuffle)reshuffle();ui.i=0;resetView();view();});
$('fsUp').addEventListener('click',function(){ui.fs=Math.min(26,ui.fs+1);saveSet();view();});
$('fsDown').addEventListener('click',function(){ui.fs=Math.max(13,ui.fs-1);saveSet();view();});
$('resetAll').addEventListener('click',function(){
  if(confirm('모든 풀이 기록을 지울까요? (되돌릴 수 없습니다)')){prog={};save();ui.wrongIds=[];ui.i=0;resetView();view();}
});

/* 백업 / 복원 */
$('btnExport').addEventListener('click',function(){
  try{
    var blob=new Blob([JSON.stringify(prog,null,1)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='sunseo_progress.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }catch(err){alert('이 환경에서는 파일 저장이 막혀 있습니다. 크롬/엣지에서 열어 주세요.');}
});
$('btnImport').addEventListener('click',function(){$('fileIn').click();});
$('fileIn').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result), n=0;
      Object.keys(d).forEach(function(k){
        var v=d[k];
        if(PASSAGES.some(function(p){return p.id===k;})&&v&&typeof v.sel==='number'&&v.sel>=1&&v.sel<=5){
          prog[k]={sel:v.sel,sec:(typeof v.sec==='number'?v.sec:null)};n++;
        }
      });
      save();resetView();view();alert(n+'개 문제 기록을 불러왔습니다.');
    }catch(err){alert('올바른 백업 파일이 아닙니다.');}
    $('fileIn').value='';
  };
  r.readAsText(f);
});

/* 키보드 단축키 */
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  var tg=e.target&&e.target.tagName;
  if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA') return;
  var list=getList(); if(!list.length) return;
  var q=list[ui.i], st=prog[q.id], k=e.key;
  if(k>='1'&&k<='5'){ if(!st){ui.sel=+k;view();} }
  else if(k==='Enter'){
    if(tg==='BUTTON') return;
    if(!st&&ui.sel) doCheck(q); else if(st) go(1);
  }
  else if(k==='ArrowRight'){go(1);}
  else if(k==='ArrowLeft'){go(-1);}
  else if(k==='c'||k==='C'){
    var box=$('qbox'), chk=$('clueChk');
    if(box&&chk){ui.clue=!ui.clue;chk.checked=ui.clue;if(ui.clue)box.classList.remove('noclue');else box.classList.add('noclue');}
  }
});

/* 타이머 (풀이 전에만 표시) */
setInterval(function(){
  var el=$('timer');
  if(el&&!ui.solved) el.textContent=fmtT((Date.now()-ui.t0)/1000);
},1000);

/* ============================================================
   7. 시작
============================================================ */
$('typeSel').value=ui.type;
var errs=validate();
if(errs.length){
  $('errBox').innerHTML='<pre>⚠ 데이터 검증 오류 '+errs.length+'건\n'+esc(errs.join('\n'))+'</pre>';
  if(window.console) console.warn(errs);
}
view();

})();
</script>
